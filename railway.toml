# Railway service: set Root Directory to `backend`
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Public waitlist status (no auth). Adjust if you add /api/health.
healthcheckPath = "/api/waitlist/campaign"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
